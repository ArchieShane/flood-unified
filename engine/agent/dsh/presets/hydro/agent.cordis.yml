# 排水智能体预设（DeepSeek Harness agent preset）。
# 由 python -m swbrain.dsh_bridge --render 从 agent/dsh/presets/hydro/ 渲染到 $DSH_HOME/.agent-presets/hydro/：
# __REPO__ / __PYTHON__ / __SWBRAIN_URL__ / __SKILLS_DIR__ 是渲染占位符。访问口令不渲染进来：
# MCP 服务自己从 config.toml 读（见 swbrain/mcp_server.py 的 _key），口令不落在 out/ 下的任何文件里。
#
# 这是 AGENT 面的组合：只放这一个会话贡献给宿主注册表的东西——人设、工具、技能、压缩策略。
# 模型路由、持久化、沙箱、审批都在宿主组合（web / sdk / headless 配置）里，不在这里。

# ── 身份 ────────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 当前工作目录 {{cwd}}（排水智能体仓库）。
    prefix: |-
      你是阿布扎比 DMT「会思考的排水系统」的一二维计算智能体，由 {{model}} 驱动，运行在 DeepSeek Harness 上。

      你是一二维计算智能体（热点群 SWMM + ANUGA 一二维水动力计算）。
      你的活是：说清有哪些情景与态、某个情景各态的结果（≥0.10 / ≥0.30 m 积水面积、积水量、最深）、计算进度与预计完成时间；用户明确要求「提交 / 申请 / 重算」时才提交计算申请，并告诉对方去管理端批准。
      只能通过 mcp__swbrain__* 工具拿数字（hydro_cases / hydro_result / hydro_progress / hydro_submit），不要编造。
      情景键：M61 = 模型版（以此为准）、R61 = 原计算域 61 mm、R96 = 96 mm、D24 = 设计暴雨 24 h、U61 = 客户单元版；态：L1 现状、L2 移动泵、L2P = L2+planned、L2S3 = L2+suggested v3。
      回答用用户的语言，先给结论和关键数字（带单位、带情景与态），再给统计口径。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 排水系统本体：MCP 工具 ────────────────────────────────────────────────
# swbrain.mcp_server 是薄桥，转发到正在运行的排水智能体 HTTP 服务（同源、同缓存）。
# 首次问到某个情景要等它的调度上下文（预热没完时 40–110 s），所以超时放宽到 5 分钟。
- id: mcp-swbrain
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: swbrain
    transport: stdio
    command: __PYTHON__
    args: ['-m', 'swbrain.mcp_server']
    cwd: __REPO__
    env:
      SWBRAIN_URL: __SWBRAIN_URL__
      # 这个 MCP 服务代表哪个智能体：只把它名下的动作做成工具（多智能体，2026-10-02）
      SWBRAIN_OWNER: hydro
      # 统一身份：每轮对话的委托凭据由服务写在这里（对话结束即删），MCP 每次调用前读，按发起对话的人判职能。
      # 控制台对话走的是 sdk 补丁，登录用户由服务写；原生 Web UI 由 web_command 置 SWBRAIN_READONLY=1（那边分不出是谁在用）
      SWBRAIN_DELEGATION_FILE: __DELEGATION_FILE__
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    # 要比服务端最慢的一次冷算长，且不短于 MCP 桥的 HTTP 超时（SWBRAIN_TIMEOUT_S，缺省 600 s）：
    # 原来 300 s，冷情景算到一半 dsh 先超时、再重试，服务端同一份算两遍（2026-09-30 实测一问 773 s）
    toolCallTimeoutMs: 660000
    failOnStartupError: false

# ── 技能：领域玩法说明书随预设走 ─────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - __SKILLS_DIR__

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 只读地看仓库文档（docs/、README）──────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 与人的交互 ──────────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── 上下文压缩（长对话）─────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
