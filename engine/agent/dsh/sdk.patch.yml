# sdk / headless 配置树的覆盖层：这两个 profile 没有预设机制，所以把人设、MCP 工具、技能直接放到宿主组合里。
# 按 id 覆盖整段 config；占位符由 swbrain.dsh_bridge 渲染。
- id: system-prompt
  config:
    personaSuffix: 当前工作目录 {{cwd}}（排水智能体仓库）。
    personaPrefix: |-
      你是阿布扎比 DMT「会思考的排水系统」的排水智能体，由 {{model}} 驱动，运行在 DeepSeek Harness 上。
      系统围绕「积水点」的全生命周期工作。客户最终要的两个答案是：某个积水点什么时候退水、用什么手段最快退水；并且要分清单点最优（只顾这一个点）与全局最优（第三道防线的调度求解器）。
      你只能通过 mcp__swbrain__* 工具拿数字；swbrain 服务器的说明里有本体（对象类型、规则、动作）与工作方式，照着做。不要编造任何数字。
      问到某个点「什么时候退 / 怎样最快 / 派几台泵」先调 mcp__swbrain__recession_options；要全貌调 mcp__swbrain__inspect_point；筛点调 mcp__swbrain__list_points。
      用用户的语言回答（中文或英文），先给结论和关键数字（带单位、带情景），再给依据和假设。会写文件的两个动作（issue_alert、record_observation）只在用户明确要求时调用。
      需要背景知识时加载 drainage-flood-point 技能。

- id: agent-default-model
  config:
    provider: __PROVIDER__
    model: __MODEL__

- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - __SKILLS_DIR__

- insert:
    - id: mcp-swbrain
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: swbrain
        transport: stdio
        command: __PYTHON__
        args: ['-m', 'swbrain.mcp_server']
        cwd: __REPO__
        env:
          SWBRAIN_URL: __SWBRAIN_URL__
          # 统一身份：每轮对话的委托凭据写在这里（对话结束即删），MCP 每次调用前读它，按发起对话的人判职能。
          # 控制台走的是 sdk profile（这份补丁），漏了这行的话 MCP 只剩旧口令，统一身份下每个工具调用都被拒（2026-10-01 实测 403）
          SWBRAIN_DELEGATION_FILE: __DELEGATION_FILE__
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        # 不短于 MCP 桥的 HTTP 超时（SWBRAIN_TIMEOUT_S，缺省 600 s）：原来 300 s，冷情景算到一半 dsh 先超时并重试，服务端同一份算两遍
        toolCallTimeoutMs: 660000
        failOnStartupError: false

# 控制台入口走的是 sdk profile，它从 dsh-base 继承了 shell / 后台任务 / 联网工具；面向客户的排水智能体只该通过 swbrain 工具拿数字，
# 不该在服务器上跑 PowerShell、起后台任务或上网（2026-09-22 演练里模型用 pwsh+grep 翻工作区文件）。Web UI 的 drainage 预设本来就没有这些工具。
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-web
  disabled: true
