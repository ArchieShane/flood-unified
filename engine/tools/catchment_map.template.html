<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>积水点与汇水区</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{height:100%;margin:0;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#1f2933}
  #app{display:flex;height:100%}
  #side{width:320px;overflow:auto;border-right:1px solid #d9dee3;background:#fff}
  #side h1{font-size:16px;margin:0;padding:14px 16px;border-bottom:1px solid #e5e9ed}
  .row{padding:10px 16px;border-bottom:1px solid #eef1f4;cursor:pointer}
  .row:hover,.row.on{background:#eef5ff}
  .row b{display:inline-block;min-width:26px}
  .row small{display:block;color:#6b7785}
  .tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:8px;background:#eef1f4;margin-left:4px}
  #map{flex:1;min-height:0}
  .legend{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px}
  .legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
  @media(max-width:700px){#app{flex-direction:column-reverse}#side{width:auto;height:38%;border:0;border-top:1px solid #d9dee3}}
</style>
</head>
<body>
<div id="app">
  <div id="side"><h1>积水点与汇水区</h1><div id="list"></div></div>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA = /*DATA*/null;
const COLORS = {"RB3":"#2f6fed","RD09":"#e8590c","RBE1-OF1":"#2f9e44","RD-A":"#ae3ec9","RD14":"#d6336c",
                "MU86":"#0c8599","MU14":"#74b816","MU87":"#f08c00","MU189":"#7048e8"};
const map = L.map('map',{preferCanvas:true}).setView([24.45,54.45],10);
const base={
  '街道图':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}),
  '卫星影像':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'})
};
base['街道图'].addTo(map);
L.control.layers(base,null,{position:'topright'}).addTo(map);

const polyLayers = {};
const domain = L.geoJSON(DATA.domain,{style:{color:'#555',weight:2,dashArray:'6 4',fill:false}})
  .bindTooltip('C1 计算域 38.1 km²',{sticky:true}).addTo(map);
const polys = L.geoJSON(DATA.polys,{
  style:f=>({color:COLORS[f.properties.key],weight:2,fillColor:COLORS[f.properties.key],fillOpacity:.22}),
  onEachFeature:(f,l)=>{
    polyLayers[f.properties.key]=l;
    const p=f.properties;
    l.bindTooltip(`<b>${p.name}</b><br>面积约 ${p.area_km2} km²`,{sticky:true});
    l.bindPopup(`<b>${p.name}</b>（面积约 ${p.area_km2} km²）<br><b>文件</b>：<code>${p.file}</code><br><b>QGIS 图层</b>：${p.layer}<br><b>要素</b>：${p.feature}`,{maxWidth:380});
  }}).addTo(map);

const markers = {};
const pts = L.geoJSON(DATA.points,{
  pointToLayer:(f,ll)=>L.circleMarker(ll,{
    radius:f.properties.main?9:6,color:'#fff',weight:2,
    fillColor:COLORS[f.properties.geo],fillOpacity:1}),
  onEachFeature:(f,l)=>{
    const p=f.properties; markers[p.id]=l;
    l.bindPopup(`<b>积水点 ${p.id}</b>${p.main?'':'（同址/同汇水区）'}<br>${p.loc}<br>片区：${p.zone}<br>
      汇水区：${p.cat}（表中 ${p.area} km²）<br>等级：${p.crit}<br>计划完成：${p.due}<br>
      ${p.in_poly?'落在对应汇水区内':'<span style="color:#c92a2a">不在对应汇水区内</span>'}`);
    l.bindTooltip(p.id,{permanent:true,direction:'right',offset:[8,0],className:'lbl'});
  }}).addTo(map);
const fitAll=()=>{map.invalidateSize();map.fitBounds(polys.getBounds().pad(.05))};
fitAll();addEventListener('load',fitAll);

// 侧栏：按表格行分组
const rows = new Map();
DATA.points.features.forEach(f=>{const r=f.properties.row; if(!rows.has(r)) rows.set(r,[]); rows.get(r).push(f.properties)});
const list = document.getElementById('list');
[...rows.values()].forEach(g=>{
  const m=g.find(p=>p.main), others=g.filter(p=>!p.main).map(p=>p.id);
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<b>${m.id}</b>${others.length?'<span class="tag">+ '+others.join(' / ')+'</span>':''}
    <small>${m.loc}</small><small>${m.cat} · ${m.area} km² · ${m.due}</small>`;
  d.onclick=()=>{
    document.querySelectorAll('.row.on').forEach(e=>e.classList.remove('on')); d.classList.add('on');
    const keys=[...new Set(g.map(p=>p.geo))];
    // RB3/RD09 很大，聚焦时只缩放到积水点
    const big=keys.some(k=>k==='RB3'||k==='RD09');
    const b=L.featureGroup(big?g.map(p=>markers[p.id]):keys.map(k=>polyLayers[k]));
    map.fitBounds(b.getBounds().pad(.2));
    markers[m.id].openPopup();
  };
  list.appendChild(d);
});

const lg=L.control({position:'bottomright'});
lg.onAdd=()=>{const e=L.DomUtil.create('div','legend');
  e.innerHTML='<div><i style="background:#2f6fed;opacity:.5"></i>面：汇水区</div><div>●（大）表中主编号 ●（小）同址/同汇水区</div><div><i style="border:2px dashed #555"></i>C1 计算域</div>';return e};
lg.addTo(map);
const st=document.createElement('style');st.textContent='.lbl{background:rgba(255,255,255,.85);border:0;box-shadow:none;font-weight:600;padding:0 3px}';document.head.appendChild(st);
</script>
</body>
</html>
