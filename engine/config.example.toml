# 会思考的排水系统（swbrain）配置
# 所有源库只读；唯一可写的是 [output] 指向的本地 sw_brain 库。

[source.pipe]
host = "PIPE_DB_HOST"
port = 5443
user = "postgres"
password = "CHANGE_ME"
dbname = "pipe"
schema_assets = "dmt_irrigationstormwater_abudhabi"
schema_network = "dmt_irrigationstormwater_abudhabi_network"

[source.makani]
host = "PIPE_DB_HOST"
port = 5443
user = "postgres"
password = "CHANGE_ME"
dbname = "makani_sync_full"

[source.flood]
# 客户 L1 雨水资产台账（35 张表、49.7 万行）+ 汇水区边界。只读。
host = "FLOOD_DB_HOST"
port = 5443
user = "postgres"
password = "CHANGE_ME"
dbname = "flood"

[source.liveability]
host = "PIPE_DB_HOST"
port = 5443
user = "postgres"
password = "CHANGE_ME"
dbname = "liveability_data_20260730"

[output]
host = "localhost"
port = 55432
user = "postgres"
password = "CHANGE_ME"
dbname = "sw_brain"
schema = "swbrain"
srid = 32640

[model]
# 标高基准：源库里所有 level 字段都是 MSL=100 的本地基准（由井盖标高分布与拍门出水口标高推得）
datum_offset_m = 100.0
# 设计高潮位（米，NADD≈MSL）。DMT WA-726-1 表 4-5：观测到风暴高潮 +1.3 m，设计取 +1.3 m（含 0.5 m 海平面上升余量）
tide_high_m = 1.3
# 径流系数（密集城区默认）。DMT 表 3-8：沥青/混凝土 0.90、屋面 0.85、联锁砖 0.78、灌溉绿地 0.15；按用地加权的 C 待地表覆盖数据到位后替换
runoff_c = 0.85
# 每个进水口/雨水井代表的汇水面积（平方米）。阿布扎比地块多自排渗井，路面进水口主要收道路：按 30 m 间距 × 20 m 半幅计
inlet_area_m2 = 600.0
# 沿管长折算的道路汇水宽度（米），与进水口法取大者
road_width_m = 20.0
# 标高无效或逆坡时用于算能力的最小坡度、无标高时的默认坡度
min_slope = 0.0005
default_slope = 0.002
# 设计历时（分钟）
duration_min = 15
# 蓄水量按此降雨深度算（毫米，单场设计雨）
design_depth_mm = 25.0

[model.scenarios]
# 设计雨强（mm/h，15 分钟历时），取 DMT WA-726-1 (2022) 表 3-6 B 区：常规 = 5 年一遇（一般管网设计标准）、强降雨 = 25 年、极端 = 50 年、百年一遇 = 100 年
"常规" = 51.0
"强降雨" = 84.1
"极端" = 118.2
"百年一遇" = 138.5
[model.scenario_return_period]
"常规" = 5
"强降雨" = 25
"极端" = 50
"百年一遇" = 100

[model.manning]
default = 0.013
GRP = 0.011
UPVC = 0.011
uPVC = 0.011
PVC = 0.011
HDPE = 0.011
HDPI = 0.011
"Reinforced Concrete" = 0.013
"Vitrified Clay" = 0.013
Concrete = 0.013
Other = 0.013
Undefined = 0.013

[model.storage]
# 无尺寸时的默认容积（立方米）
soakaway_default_m3 = 12.0
reservoir_default_m3 = 500.0
soakaway_porosity = 0.35

[decision]
ratio_threshold = 1.0
target_ratio = 0.85
standard_diameters_mm = [150, 200, 225, 250, 300, 375, 400, 450, 500, 600, 700, 800, 900, 1000, 1200, 1400, 1500, 1600, 1800, 2000, 2200, 2400, 2600, 3000]
# 无出路汇水区提建议的最小汇水面积（公顷）
no_outlet_min_ha = 2.0
# 提议点 500 m 内已有在批雨水结构，则建议并入该项目
merge_planned_within_m = 500.0
# 雨季前维护截止（月-日）
rainy_season_deadline = "10-31"
# 事件前调度触发：NCM 预报 24 小时雨量阈值（毫米）
event_trigger_rain_mm = 20.0
# 低点判定：井盖标高低于所在汇水区中位数多少米（上限防止基准混杂造成的假低点）
low_point_below_median_m = 0.5
low_point_max_m = 3.0
# 出水口汇水区里最低一成进水口相对高潮位的净空低于此值（米）视为高潮易涝。阿布扎比最低进水口约 +1.85 m MSL，取 1.5 留出长距离干管的水头损失
tide_clearance_min_m = 1.5
# 片区排序的最小管长（公里），太小的片区不参与排序
zone_min_km = 5.0
# 断头终点上游超过此面积（公顷）视为疑似漏登的出水口/泵站，走核实而不是补蓄水
dead_end_suspect_ha = 20.0
# 每类建议最多输出条数
max_per_type = 60

[exchange]
# 与预测侧（一维二维水动力 / 世界模型）的文件交换目录：predictions/ 收基线预测，requests/ 发 what-if 请求，results/ 收评估结果
dir = "exchange"
# 预测侧的 HTTP 接口；留空则只落文件
http_url = ""
network_version = "pipe@2026-09-15"

[cost]
# 单价全是占位（AED），要换成 ADM/ADPIC 的费率表
pipe_aed_per_m_by_dn = { "300" = 1200, "400" = 1500, "500" = 1900, "600" = 2400, "800" = 3300, "1000" = 4500, "1200" = 6000, "1500" = 8500, "2000" = 13000, "3000" = 25000 }
storage_aed_per_m3 = 900
storage_fixed_aed = 500000
pump_aed_per_m3s = 4000000
pump_fixed_aed = 2000000
tide_gate_aed = 800000
connect_fixed_aed = 150000
survey_aed_per_item = 20000
temp_pump_aed_per_event = 15000

[whatif]
# 一轮资本计划的预算（AED），贪心按 收益/成本 选到用完
budget_aed = 200000000
# 入选前 N 条各自成一个干预集合、再打一个包，交给预测侧评估
request_top_n = 10

[whatif.kpi_weights]
# KPI 每减少一个单位记多少分；代理评估与外部评估的 KPI 名都在这张表里
surcharge_len_km = 1.0
affected_inlets = 0.02
tide_exposed_inlets = 0.02
storage_deficit_m3 = 0.001
no_outlet_len_km = 0.5
flood_volume_m3 = 0.001
flooded_area_m2 = 0.00001
affected_buildings = 0.1
tide_locked_min = 0.05

[standard]
# 验收标准：两个工程都按它算「达标」。目标情景名要在 [model.scenarios] 里
target_scenario = "百年一遇"
target_return_period_yr = 100
climate_factor = 1.2
# 可接受积水：按用地类型的最大深度（米）与最长历时（分钟）。0 表示不允许
acceptable_depth_m = { road = 0.15, plot_residential = 0.0, plot_other = 0.10, critical_facility = 0.0, open_space = 0.30 }
acceptable_duration_min = 30
# 代理评估下的达标判据：目标情景下承载不足管长占比 ≤ 此值、高潮暴露进水口 = 0、蓄渗缺口 = 0、疑似漏登终点 = 0
surcharge_share_tolerance = 0.05
# 分期：年度预算（AED）与最长年限；X 年 = ceil(达标总成本 / 年度预算)，超过 max_years 就要么加钱要么降标准
annual_budget_aed = 1500000000
max_years = 15

[standard.scenario_weights]
# 稳健选择的情景权重：干预的收益 = Σ 权重 × 该情景下 KPI 的减少量。按年超越概率 1/T 归一（5/25/50/100 年）
"常规" = 0.74
"强降雨" = 0.15
"极端" = 0.07
"百年一遇" = 0.04

[verification]
# 每场雨后的对账：触发阈值与合格线
event_rain_trigger_mm = 20.0
observation_sources = ["NCM 雨量站", "泵站液位与运行记录", "市政投诉/警情积水点", "无人机或卫星影像", "现场巡检打点"]
pass_pod_min = 0.80
pass_far_max = 0.30
pass_depth_rmse_m = 0.10
# 连续几场不合格触发模型重校准与方案重算
recalibrate_after_failures = 2

[dispatch]
# 第二、三道防线：预报后预置与事中应急调度。泵队来自 exchange/fleet.json，没有就按客户预案 A 生成。
# 积水点来源 flood_source：system = 本系统（客户热点 × 管网缺口 × DTM 洼地，按 system_points_rp 年一遇，控制台切重现期时当场重算）；
# prediction = exchange/predictions 里最新的世界模型输出；auto = 能用 system 就 system，否则 prediction，再否则模拟
flood_source = "system"
system_points_rp = 10
simulate_if_missing = true
# 事件开始后第几分钟做调度决策（默认雨峰 180 分钟后 30 分钟）
decision_time_min = 210
# 重点单位影响半径（米）、排放去处搜索半径（米）
facility_radius_m = 300
discharge_radius_m = 1500
# 软管实际要走多远 ÷ 直线距离。实测路网/直线的中位是 1.66（40 个点抽样，四分位 1.32/2.52）。
# 缺省 1.0 = 用直线，保持原行为；改大之前要想清楚：约一半的可派泵点会因为超出半径而变成只能靠罐车。
discharge_detour_factor = 1.0
# 离最近排放终点超过这个距离 = 这一片根本没有管网数据（而不是「没有排放去处」）。
# 实测：ADM 的点最远 16.1 km，AAM 最近 27.9 km、DRM 最近 88.8 km，两组不重叠。
discharge_unknown_beyond_m = 20000
# 超过软管长度、但在排放半径内的，标「需接力」（两台泵串联或铺长管），行程外加架设时间
relay_beyond_m = 300
# 一个积水点最多同时几台泵；单程最长可接受行程（分钟）
max_units_per_point = 3
max_travel_min = 90
# 目标函数里行程与架设时间的权重（相对于优先级）
tie_penalty = 0.02
waves = 3
slow_factor = 3.0
# 积水挡路用的面怎么来：area = 按积水面积还原等效圆（缺省）；point = 用原始点（等于关掉这个功能）
flood_extent_from = "area"
# 等效圆的最小半径 m：面积再小也按这个算，免得一条路正好压在小积水点上却判不出来
flood_extent_min_r_m = 15
# 预置：规定到达时间（分钟）内的最大加权覆盖；按预警等级放宽范围、增加驻地数（见下面两张子表）
preposition_cover_min = 20
# 预置的价值重演：预置在驻地的泵在事件开始后第几分钟出发（WA-726-3 动员 30 分钟）
preposition_depart_min = 30

# 接力排放：排放点超出 relay_beyond_m 的部分每 relay_hose_m 一级接力，每级泵排量 × relay_rate_factor（不低于 relay_min_factor），每级多一次架设时间；规划级近似，等泵厂家水头曲线
relay_hose_m = 100
relay_rate_factor = 0.85
relay_min_factor = 0.4
# 第三道页面地图时间轴的采样步长（分钟）
timeline_dt_min = 15
# 额外的预置候选驻地（JSON 列表 site_id/name/lon/lat[/area]）：DMT 模型导出里的临时塘，python -m swbrain.dmtmodel 生成
extra_sites_file = "out/dmt_model/ponds_sites.json"

# 求解器：v1 = 三波分派 MILP；v2 = 处置包 + 资源（泵 / 车 / 人 / 物资 / 罐车）+ 滚动时间轴 + 费用进目标（swbrain/dispatch2.py，设计见 docs/第三道防线优化调度方案设计.md）
solver = "v2"

[dispatch.v2]
# 滚动窗口（分钟）、规划视界、最多几个窗口
window_min = 60
horizon_min = 1440
max_windows = 8
# 目标函数里「一个优先级·小时的积水」值多少 AED：三档对应 最快退水 / 平衡 / 最省钱（帕累托三点）
default_objective = "balanced"
value_aed_per_priority_hour = { fastest = 1000.0, balanced = 100.0, cheapest = 10.0 }
# 错过目标时限的加权延误权重；各等级可接受的单程行程上限（分钟）
delay_weight = 1.0
max_travel_min_by_level = { III = 120, II = 90, I = 90 }
max_units_per_point = 3
# 处置包重演步长；罐车包的辆数档
package_dt_min = 10
tanker_counts = [2, 4, 6]
# 抢占：入流已低于在场排量的这个比例、且剩余水量在这么多分钟内抽完，就把多余的泵释放去下一个点
preempt_inflow_share = 0.3
preempt_remaining_min = 30
milp_time_limit_s = 30
# 帕累托另两个目标 + 承包商各管各的对照三路：缺省顺序跑。并行（true）在 2026-09-22 真机试过：HiGHS 与重演都握着 GIL，四路并行反而让服务整体卡住（88 线程、单核饱和、HTTP 20 s 不响应），别开
parallel_extras = false

[dispatch.robust]
# 鲁棒目标（严格版）：处置包的收益 = Σ 情景权重 × 该情景过程线上重演的收益，一张单同时对几种雨；权重按年超越概率大致归一（与 [standard.scenario_weights] 同思路）。
# 控制台第三道「鲁棒」开关 / /api/dispatch?robust=1 / 智能体 dispatch_plan(robust=true) 用它；每个处置包要重演 |S| 次，求解时间约 ×|S|
enabled = true
scenarios = { "10cc" = 0.6, "25" = 0.3, "50" = 0.1 }

[dispatch.resources]
# 运输车辆 / 班组 / 物资 / 费率：客户没给的按行业常规模拟（simulated = true 时页面标「模拟」）；fleet.json 的 depots[].resources 可逐项覆盖
simulated = true
regions = ["ADM", "AAM", "DRM"]
# 一辆车（重卡带吊 / 轻型拖挂）服务几台泵、90 min 窗口内跑几趟、各型号一车载几台
units_per_vehicle_heavy = 2
units_per_vehicle_light = 2
trips_per_window = 2
carry = { "diesel-12in" = 1, "diesel-8in" = 2, "diesel-6in-x3" = 1 }
# 人员：无人员数的片区按每台泵 2.5 人；当班 50%，其余 60 min 内召回；12 h 班次、30 min 交接
crew_per_unit_if_missing = 2.5
on_duty_share = 0.5
callable_mobilization_min = 60
shift_h = 12
handover_min = 30
# 物资：软管库存每台 250 m，铺设 = 50 m 基础 + 每级接力 100 m；燃油库存每台 400 L，消耗 L/h 按型号；照明每 2.5 台一套；路障每热点 2 套
hose_m_per_unit = 250
hose_base_m = 50
hose_per_stage_m = 100
fuel_l_per_unit = 400
fuel_l_per_h = { "diesel-12in" = 25, "diesel-8in" = 12, "diesel-6in-x3" = 18 }
lights_per_unit = 0.4
barriers_per_hotspot = 2
# 费率（占位，等费率表）：人工 AED/人·h，车辆 AED/km（重 / 轻），车速 km/h，柴油 AED/L，夜班加价与时段
crew_aed_h = 35.0
vehicle_aed_km = { heavy = 4.0, light = 2.5 }
vehicle_speed_kmh = 35.0
fuel_aed_l = 2.6
night_premium = 1.25
night_hours = [19, 6]

[dispatch.contractors]
# ADM 现状（2026-09-22 应急室会议）：5 家雨水运维承包商按地理分区各管各的，只有严重时市政开工单叫别家。这里承包商 = 预案 A 片区（ADM 五片区各一家），
# AAM / DRM 各按市政一家（模拟）。mode：pooled = 集中调度（管理层决定资源去哪，跨区支援开工单）；silo = 各管各的（现状）。compare_silo 同时算现状作对照。
simulated = true
mode = "pooled"
work_order_aed = 2000
compare_silo = true

[dispatch.bridges]
# 限重桥 / 净高不足的下穿道：重型车（泵 + 车 ≈ 12 t、高 3.8 m）过不去的，在重型行程矩阵里把附近路段断开。没有桥梁台账，下面两条是模拟占位；
# 真实台账放 exchange/bridges.json（契约 swbrain.bridges/1，见 [feeds.bridges]，可拉可推）到了就替换这里、不再标模拟
simulated = true
radius_m = 40
vehicle_tare_t = 4.0
heavy_height_m = 3.8
items = [
  { name = "Al Bahia canal culvert (simulated)", lon = 54.6330, lat = 24.5170, limit_t = 10 },
  { name = "Mussafah channel bridge (simulated)", lon = 54.5100, lat = 24.3470, limit_t = 10 },
]

[dispatch.impassable_depth_m]
light = 0.30
heavy = 0.45

[dispatch.target_drain_min]
hospital = 120
tunnel = 180
metro = 180
school = 240
ambulance = 180
default = 360

[dispatch.facility_weight]
hospital = 10
tunnel = 8
metro = 6
school = 5
ambulance = 4
civil_defense = 4
rescue = 4
clinic = 2

[dispatch.preposition_max_sites]
"蓝" = 4
"黄" = 6
"橙" = 9
"红" = 12
[dispatch.preposition_priority_quantile]
"蓝" = 0.75
"黄" = 0.50
"橙" = 0.25
"红" = 0.0

[dispatch.simulation]
scenario_name = "50年一遇（模拟）"
return_period_yr = 50
n_points = 60
n_depots = 12
seed = 42
[dispatch.simulation.units]
"trailer-500" = 18
"truck-1500" = 16
"heavy-3000" = 6

[gwm]
# 世界模型（Abu Dhabi Urban Flood GWM API，本机 Docker 容器 abu-dhabi-gwm）。适配器：python -m swbrain.gwm
base_url = "http://127.0.0.1:8090"
token_file = "<世界模型 API 令牌文件（可选）>"
# 本机能直读结果目录时用它（省去下载 22 MB 的 npz）；跨机部署留空走接口
runs_dir = "<世界模型推演结果目录（可选）>"
# 聚合参数：≥ depth_min_m 的格算积水；核之间至少隔 separation_m；每格最多归到 assign_radius_m 内的核；最多输出 max_points 个点
depth_min_m = 0.30
separation_m = 750
assign_radius_m = 1500
max_points = 150
hydrograph_step_min = 15

[idf]
# 阿布扎比 DMT《雨水与地下排水设计手册》WA-726-1 第三版（2022-04）表 3-6 / 3-7，B 区（阿布扎比市区、Dhafra、艾因非山区）。
# A 区（艾因东北山区，>200 m 等高线）另有表 3-4 / 3-5，未收录。页面重现期开关、管网筛查、世界模型输入都从这里取数。
source = "DMT WA-726-1 (2022) 表 3-6 B 区"
source_en = "DMT WA-726-1 (2022) Table 3-6, Zone B"
zone = "B"
duration_hours = 24
durations_min = [5, 10, 15, 30, 60, 120, 180, 360, 720, 1440]
[idf.intensity_mmh]
# 表 3-6 雨强 mm/h，与 durations_min 一一对应
"2" = [48.39, 29.54, 22.13, 13.51, 8.25, 5.04, 3.77, 2.30, 1.41, 0.86]
"5" = [113.18, 68.48, 51.04, 30.88, 18.68, 11.30, 8.43, 5.10, 3.08, 1.87]
"10" = [127.64, 77.34, 57.70, 34.96, 21.18, 12.84, 9.57, 5.80, 3.52, 2.13]
"25" = [189.05, 113.38, 84.07, 50.42, 30.24, 18.13, 13.45, 8.06, 4.84, 2.90]
"50" = [277.48, 161.98, 118.22, 69.01, 40.28, 23.51, 17.16, 10.02, 5.85, 3.41]
"100" = [325.17, 189.81, 138.54, 80.87, 47.21, 27.56, 20.11, 11.74, 6.85, 4.00]
[idf.equation]
# 表 3-7：i = alpha * t^(-beta)，t 为小时
"2" = { alpha = 8.248, beta = 0.712 }
"5" = { alpha = 18.685, beta = 0.725 }
