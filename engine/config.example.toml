[standards]
# 手册表 3-2（设计重现期）与表 3-3（历时倍数）按用地/设施分级。分级依据 makani：道路中心线 roadtype、道路隧道面、机场面、公园面、建筑用途与层数；重点单位来自 refdata 缓存。
# 分级是启发式，下面每个数都能改；用 python -m swbrain.standards --build-ref 抓参考数据。
entry_time_min = 10
v_full_clip_ms = [0.3, 3.0]
road_buffer_m = 30
tunnel_buffer_m = 60
airport_buffer_m = 50
facility_buffer_m = 100
building_buffer_m = 150
high_density_min_floors = 4
# 渗井类建议因 §4.12 需个案批准，优先级乘此系数
soakaway_priority_factor = 0.85
[standards.classes]
# 类别 -> 设计重现期 rp、校核重现期 check（0 = 无）、历时倍数 m（表 3-2 / 3-3）
underpass = { rp = 50, check = 100, m = 1 }
airport = { rp = 25, check = 50, m = 1 }
major_road = { rp = 10, check = 0, m = 1 }
critical_facility = { rp = 10, check = 0, m = 2 }
industrial = { rp = 5, check = 0, m = 5 }
open_space = { rp = 5, check = 0, m = 12 }
high_density = { rp = 5, check = 0, m = 2 }
low_density = { rp = 5, check = 0, m = 3 }
general = { rp = 5, check = 0, m = 2 }
[standards.roadtype_major]
# udm_roadcentreline.roadtype 里视为「主干路」的取值（假设：secondaryRoad 也算）
values = ["majorRoad", "secondaryRoad"]

[hotspots]
# 客户热点清单（DMT 三个市政区的 Stormwater Hotspot Analysis 工作簿，2026-09-09 v4.x）。解析：python -m swbrain.hotspots --dir <目录>
file = "exchange/hotspots/hotspots.json"
# 客户 2026-09-20 发来的「506 Hot Spots AUH.kmz」：ADM 热点的修正坐标（v4.4 工作簿的经纬度整体错了一行）。解析时按序号覆盖 ADM 的坐标；文件是客户数据，不入库
coords_kmz = "<coords_kmz>"
coords_kmz_region = "ADM"
# 积水点 / 建议 与客户热点的匹配半径（米）
match_radius_m = 300
# 客户重要度 → 调度优先级加权
[hotspots.criticality_weight]
"Very High" = 6
"High" = 4
"Medium" = 2
"Low" = 1
# 预案 A 的泵型号 → 排量等参数（客户表只给尺寸与小时单价，排量按柴油自吸泵典型样本估，是假设）
[hotspots.pump_models]
"12in" = { model = "diesel-12in", rate_m3h = 700, head_m = 15, hose_m = 100, setup_min = 25, crew = 3, weight_t = 8.0, vehicle_class = "heavy", duty_aed_h = 90 }
"8in" = { model = "diesel-8in", rate_m3h = 350, head_m = 15, hose_m = 100, setup_min = 20, crew = 2, weight_t = 4.0, vehicle_class = "light", duty_aed_h = 60 }
"6in" = { model = "diesel-6in", rate_m3h = 180, head_m = 12, hose_m = 60, setup_min = 15, crew = 2, weight_t = 2.0, vehicle_class = "light", duty_aed_h = 36 }
# 6 寸泵数量大，进分派模型时按 bank_size 台一组建模（组内同驻地同型号）
six_inch_bank = 3
# 罐车：客户表只给数量与 250 AED/h；容量按 4,500 gal 罐车估
tanker_capacity_m3 = 17.0
tanker_duty_aed_h = 250

[dispatch.cost]
# 应急泵的指示性成本：台时 × 小时单价 + 每台动员费。小时单价用客户预案 A 表的 duty_aed_h（[hotspots.pump_models]：12 寸 90 / 8 寸 60 / 6 寸 36 AED/h）
# 台时从出发算到该点重演退干；48 h 内退不干按 horizon_min。下面三项是假设，等客户费率表
mobilisation_aed_per_unit = 500
min_duty_h = 4
default_duty_aed_h = 60
horizon_min = 2880

[dispatch.tankers]
# 罐车：客户预案 A 表只给数量与 250 AED/h；容量按 4,500 gal（17 m³）。派给「1.5 km 内无排放去处」且泵没处置的点：有效排量 = 容量 / 周转（装 + 卸 + 往返最近可接纳排放点，没有按缺省运距）
enabled = true
capacity_m3 = 17
duty_aed_h = 250
load_min = 10
unload_min = 10
speed_kmh = 30
default_haul_km = 5
# 最近可接纳排放点超过这个距离（艾因 / Dhafra 常见）按缺省运距到就近处置点算；派满上限也在 horizon_min 内拉不完的点不派（不浪费池）
max_haul_km = 15
horizon_min = 2880
max_per_point = 6

[dispatch.manual_levels]
# 预警等级 ↔ WA-726-3 表 11-1 / 附录 H-1 的应急分级。蓝 = 例行（不宣布应急），黄/橙/红 = 预计 I/II/III 级（优先级 C/B/A）
# 手册指标：到场目标 2 小时（11.6；WA-726-4 §17000 1.1.1），应急动员 30 分钟（5.7.1 KPI）
trt_min = 120
mobilization_min = 30
"蓝" = { level = "0", priority = "-", zh = "例行：预报有雨，巡查班组待命，不宣布应急", en = "Routine: rain forecast, patrol teams on standby, no emergency declared" }
"黄" = { level = "I", priority = "C", zh = "I 级：路面积水，例行班组处置不了需应急土建班组；对公众与财产无风险（工头→网络工程师宣布）", en = "Level I: surface flooding beyond routine crews, emergency civil team needed; no risk to public or property (Foreman → Networks Engineer declares)" }
"橙" = { level = "II", priority = "B", zh = "II 级：VIP 地点 6 小时内可恢复、室内积水、支路交通受阻、管网隔离 ≤6 小时、可能引起媒体关注（高级网络工程师宣布）", en = "Level II: VIP location fixable within 6 h, internal property flooding, branch roads blocked, network isolated ≤6 h, potential media interest (Senior Networks Engineer declares)" }
"红" = { level = "III", priority = "A", zh = "III 级：VIP 地点 6 小时内不能恢复、多处物业外部积水、主干路/高速受阻、多座泵站失电、对公众与财产高风险（项目经理宣布，联合部门设控制室）", en = "Level III: VIP location not fixable within 6 h, external flooding of many properties, main roads/highways blocked, power loss at multiple pump stations, high risk to public and property (Project Manager declares, joint control room)" }


[terrain]
# 客户提供的 5 m DTM（EPSG:32640，全酋，2026-03，ADNOC 来源）。2026-09-19 抽 6,000 个进水口实测：井盖标高 − DTM 中位 99.8（岛上）/ 100.2 m（内陆），
# 82% 在 ±0.5 m 内 → 台账 level = DTM + [model].datum_offset_m。文件不存在时全部地形功能自动跳过。
dtm_path = "<5 m DTM GeoTIFF 路径（AUH_DTM_5m_Z40.TIF）>"
# 台账井盖标高与 DTM+基准差超过此值（米）只标可疑不改（桥面、隧道上方以台账为准）
cover_tol_m = 2.0
# 热点填洼：分析窗半宽（米）、找种子低点的半径（米）、洼地碰到窗边时加倍重算的窗半宽上限、判「近海」的低点高程（米）
window_m = 300
seed_radius_m = 30
max_window_m = 1200
coastal_z_m = 0.5
