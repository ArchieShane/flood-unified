source = "Parsons 2026-09 四份大陆汇水区评估：Shaliela 33 台 / 10 塘 404,213 m³，RB3 22 台 / 7 塘 445,012 m³，Mussafah_00 2 台 / 1 塘 900 m³，ICAD 1-3 14 台 / 10 塘 76,673 m³；泵从 DMT 模型导出里的临时塘位置出发（2026-09-20 拿到坐标），同区域各塘按最近点分泵"
