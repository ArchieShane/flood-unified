Shaliela = { area = "Al Shahama", inp = "SWMM_Export/Shaliela.inp", parsons = "Shaliela", parsons_flood_m3 = { "10cc" = 140668, "2024-04" = 1106911 } }

[traffic]
# 路况：把带路况的行程时间套到本地路网行程矩阵上（swbrain/traffic.py）。
# provider = google：Google Routes API computeRouteMatrix（TRAFFIC_AWARE，出发时刻可以是未来 → 预测路况）；密钥只从环境变量 api_key_env 读，永不写进配置或仓库；
#            按元素（起点×终点）计费：系数层每个驻地抽样 sample_per_depot 个目的地（近 / 中 / 远分层），精算层只查调度单里实际出现的 驻地→点 对（≤ refine_pairs_max）
# provider = simulated：阿布扎比工作日 / 周末时段曲线（当地 UTC+4）× 雨天加成，全驻地同一系数，页面标「模拟」；配了 google 但没密钥也退到这里
# provider = none：系数 1
provider = "google"
api_key_env = "GOOGLE_MAPS_API_KEY"
sample_per_depot = 12
refine_pairs_max = 300
cache_ttl_min = 15
cache_file = "out/traffic_cache.json"
routing_preference = "TRAFFIC_AWARE"
region_code = "AE"
# 出发时刻缺省：now = 事件按「现在开始」，决策第 t 分钟出发；也可以 /api/traffic?depart=2026-09-25T14:00（当地时间）按预报时刻取预测路况
departure = "now"
auto_refresh = true
apply_to_point_to_point = true
factor_min = 0.8
factor_max = 3.0
# 时变：后续每个滚动窗口（window_min 一档，共 windows_ahead 个）按各自出发时刻再取一次系数，早晚高峰进时间轴；Google 时后续窗口每驻地只抽 per_window_sample_per_depot 个目的地
per_window = true
windows_ahead = 8
window_min = 60
per_window_sample_per_depot = 6

[traffic.simulated]
# 暴雨时城市道路车速下降 10–20%（文献常见值）；周五、周六按周末曲线
rain_uplift = 1.15
weekend_days = [4, 5]

[feeds]
# 外部实时源（swbrain/feeds.py）。每个源：url 非空就拉（Authorization: Bearer <token_env 环境变量>，poll_s 内缓存），拉不到退回文件；
# 也可以推：POST /api/feed/<name>，正文 = 契约 JSON（exchange/examples/<name>.example.json），合并进 exchange/<name>.json。ADM 应急系统开放接口后只需填 url。
[feeds.incidents]
# 993 报案（契约 swbrain.incidents/1）：replan 自动并入、按 300 m 匹配积水点加权
file = "exchange/incidents.json"
url = ""
token_env = "ADM_INCIDENTS_TOKEN"
poll_s = 60
[feeds.checkins]
# 承包商到场 check-in（契约 swbrain.checkins/1）：预置到位率
file = "exchange/checkins.json"
url = ""
token_env = "ADM_CHECKINS_TOKEN"
poll_s = 60
[feeds.bridges]
# 桥梁限重 / 净高台账（契约 swbrain.bridges/1）：到了就替换 [dispatch.bridges].items 的模拟条目
file = "exchange/bridges.json"
url = ""
token_env = "ADM_BRIDGES_TOKEN"
poll_s = 3600
[feeds.contractors]
# 承包商服务边界（契约 swbrain.contractors/1）：depot_id → contractor，或 region/area → contractor；到了就替换按片区模拟的承包商名
file = "exchange/contractors.json"
url = ""
token_env = "ADM_CONTRACTORS_TOKEN"
poll_s = 3600
[feeds.events]
# 客户补的历史降雨事件（契约 swbrain.events/1）：event_id、date/start/end、p24_mm、分片区雨量；2024-04 与 2026-03 已在 [scenarios.events]
file = "exchange/events.json"
url = ""
token_env = "ADM_EVENTS_TOKEN"
poll_s = 3600
[feeds.episodes]
# 客户的历史积水记录（契约 swbrain.episodes/1）：某积水点在某事件里 是否积水 / 水深 / 时长 / 派泵 / 退干 / 阶段时间；ADM 的投诉、巡查、993 台账都能落成这个形状
file = "exchange/episodes.json"
url = ""
token_env = "ADM_EPISODES_TOKEN"
poll_s = 3600

[lifecycle]
# 积水点生命周期层（swbrain/lifecycle.py）：历史事件按 date 前后几天算窗口（现场观测 / 993 报案落在窗口内就归到该事件）；值班开的事件、登记的阶段、工程建议状态都只写 out/*.jsonl
event_window_days = 3
events_file = "out/events.jsonl"
episodes_file = "out/episodes.jsonl"
proposal_status_file = "out/proposal_status.jsonl"
# 雨后对账至少要多少个有记录的经历才给 pass / fail（否则 insufficient）
min_observed_for_verification = 10

[serve]
# 启动时装哪个情景（留空 = 情景目录里第一个）。不看盘上哪个预测文件最新，那会让分母随重启变
startup_scenario = ""
# 控制台访问口令：为空不设；设了以后地址要带 ?key=…（首次）或在首页输入，之后 30 天 cookie。设了口令时 serve 缺省监听 0.0.0.0
access_key = ""
# 管理端（/admin.html：多智能体、配置、调用轨迹、计算审批）的管理员口令，与 access_key 分开；空 = 管理端关闭。只放本文件，不入库
admin_key = ""
# no_warm = true 关掉启动后台预热全部情景
# 落盘缓存：算过的情景上下文与调度载荷按「代码 + 配置 + 状态指纹」存 out/cache/，重启几十秒可用（改本体 / 页面不作废；改模型模块 / 配置 / out/state 才作废）
disk_cache = true
# 求解子进程数（0 = 同进程）：HiGHS 与重演握着 GIL，进子进程后长求解不再卡住别的请求
solver_workers = 2
# 异步任务线程数（/api/dispatch?async=1 等接口返回 job_id，/api/jobs/<id> 轮询）
job_threads = 4
# 预热时调度怎么算：all = 每个情景都解一遍（缺省：智能体首问不再现解，现解一次要几分钟）；cached = 只解盘上已有的（后台少占 CPU）
warm_dispatch = "all"
# 先预热哪些情景（演示与值班最常问的放前面）；其余按情景目录。用户问到还没算的情景时它会插到队首
warm_first = ["50", "10"]
# 启动时就在后台拉起 DeepSeek Harness（约 60 s），首问不用等；false = 首问时再拉
dsh_prestart = true

# HTTPS（可选）：统一身份的回调平台登记的是 https://…:8766/auth/callback，此时要真提供 HTTPS。都空 = http。
# 本机自签：python -m swbrain.tlscert（写 out/tls/）；正式环境换成机构 CA 签的证书
tls_cert = ""
tls_key = ""
[assets]
# 排水资产台账（python -m swbrain.assets）：客户 L1/L2/L3 分级里的实体资产。
# 雨水口全量 194,510 个（vertices.node_table 为 inlet / catchbasin），不适合都装进本体，
# 只收热点半径内的。实测：100 m → 4,148 个；200 m → 24,367 个（每点中位 58）；
# 300 m → 更多。200 m 装载 1.8 s、序列化约 20 MB，量级可控。
inlet_radius_m = 200.0
inlet_max = 40000

[ponds]
# 第二道防线：汇水区滞蓄塘的选址、定容与进水方式（python -m swbrain.ponds）
# 核心判据是「有效库容 = min(库容, 进水能力 × 雨峰窗口)」——塘再大，水进不去也没用。
serve_radius_m = 1200.0            # 一个塘往上游服务多远
assign_by = "lowest"               # lowest = 归给能到达的最低点（汇水区尺度）；nearest = 归给最近的
min_head_m = 0.3                   # 点要比塘底高这么多才算能自流
min_natural_m3 = 100.0             # 天然洼地小于这个不当候选
exclude_terrain_note = ["flat", "regional"]   # 没有真洼地的、洼地漫到分析窗口边界外的
design_depth_m = 2.5               # 塘的设计水深；库容定了，占地跟着算
volume_tiers = [0.25, 0.5, 1.0, 1.5]          # 相对「服务范围峰值积水量」的倍数
max_pond_area_m2 = 200000.0        # 单塘占地上限
pipe_dn_mm = [600, 900, 1200, 1500]
pipe_slope = 0.002
pipe_n = 0.013
pump_counts = [2, 4]
pump_rate_m3h = 700.0              # 12 寸泵，与第三道防线同一口径
peak_window_min = 120.0            # 雨峰窗口：只有在这段时间里进的水才真正顶用
infiltration_mm_h = 5.0            # 塘底下渗（假设值，见假设总账 pond_infiltration）
release_m3h = 0.0                  # 受控出流（接下游管网），0 = 只靠渗和事后抽
dt_min = 10.0
horizon_min = 1440.0
min_saved_h = 0.05                 # 省不到这么多积水小时的方案包不进 MILP
milp_time_limit_s = 30.0
value_aed_per_priority_hour = 100.0   # 和第三道防线同一把尺子，三道防线才能放一起比

[ponds.cost]
# 单价全是占位值，等客户给 BoQ（见假设总账 pond_unit_cost）
excavate_aed_m3 = 45.0
pipe_min_len_m = 50.0              # 再近的点也得有一段收水管
hose_aed_m = 400.0                 # 泵配的临时排水管
pump_capital_aed = 120000.0
land_aed_m2 = 0.0                  # 市政用地缺省不计地价

[ponds.cost.pipe_aed_m]
600 = 1800.0
900 = 2900.0
1200 = 4300.0
1500 = 6100.0

[networkflood]
# 全网溢流路由的顶托代理：自己不溢、但沿流向 backwater_m 内有溢流段、且峰值利用率 ≥ backwater_ratio 的管段标「顶托风险」
backwater_m = 300
backwater_ratio = 0.8

[alerts]
# 预警触发规则层（PoC 议程第 5 项）：预报 24 h 雨量 → 目录里最接近的情景 → 三条规则取最高等级（雨量 / 该情景 III 级积水点数 / 全网溢流量）。
# 阈值是演示用的起点：雨量档对应约 5 / 25 / 100 年一遇；接了 NCM 预报后由 DMT 定
[alerts.rain_mm]
"黄" = 45
"橙" = 70
"红" = 90
[alerts.iii_points]
"黄" = 75
"橙" = 100
"红" = 150
[alerts.spill_m3]
"黄" = 1500000
"橙" = 3000000
"红" = 5000000

[agent]
# 智能体（本体驱动的交互入口，swbrain/ontology）。有大模型密钥就用 Anthropic Messages API 规划（纯 urllib），没有就用规则规划器（关键词意图 + 实体抽取）；两者动作一致。
# 密钥只从环境变量读，不写进本文件
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"
base_url = "https://api.anthropic.com"
max_steps = 6
timeout_s = 60
# 现场观测（record_observation 动作）与动作审计日志
observations_file = "out/observations.jsonl"
action_log = "out/ontology_actions.jsonl"

[agent.dsh]
# DeepSeek Harness（github.com/deepseek-ai/deepseek-harness）作为真正的 agent 运行时：pip install deepseek-harness-sdk 后自动可用。
# 规划器顺序 dsh → llm → rules。预设 / 补丁 / 技能模板在 agent/dsh/，渲染到 home；Web UI：python -m swbrain.dsh_bridge --web（或 scripts/dsh_web.ps1）
enabled = true
home = "out/dsh_home"
# Web UI 用另一个主目录（与 SDK 的会话、运行时包桩隔开）
home_web = "out/dsh_home_web"
# 模型路由：缺省有 DEEPSEEK_API_KEY 用 deepseek-official/deepseek-flash，否则有 OPENAI_API_KEY 用 openai/gpt-5.1；密钥只从环境变量读
# provider = "deepseek-official"
# model = "deepseek-v4-pro"
web_port = 3080
# Web UI 的局域网入口（控制台服务里的反向代理，只放管理员，转到 127.0.0.1:web_port；dsh 自己不许听局域网）；0 = 不开
lan_port = 3081
initialize_timeout_s = 120

[data]
# 客户原始数据的位置（一二维热点群计算用；tools/datapaths.py 读，环境变量 SWBRAIN_DATA_<键大写> 可覆盖）。
# 全部是客户数据，不入库；每项的用途见 docs/C1_资料清单.md。另两项在别处：5 m DTM = [terrain].dtm_path，热点坐标 KMZ = [hotspots].coords_kmz
gdb_zip = "<客户雨水管网 GDB 压缩包 DMT_StormWater_AbuDhabi_Processed.gdb.zip>"
gdb_dir = "<同一 GDB 解压后的 .gdb 目录>"
hotspot_xlsx_dir = "<客户热点工作簿目录（Stormwater Hotspot Analysis *.xlsx）>"
client_models_zip = "<客户 22 个水力模型 zip（OneDrive_1_9-26-2026.zip）>"
client_swmm_export = "<客户 SWMM 导出目录（含 Mussafah_00.inp）>"
parsons_root = "<Parsons 交付解压目录（含 Critical Hotspots/ 与 26092026/）>"

[routing]
# L3 卡车路线来源（swbrain/routing.py）：按顺序试，前一个求不出或连不上就换下一个。2026-10-28 用户：本地服务接入为首选，ArcGIS Online 保持备选。
# 本地服务的已知问题（路网不连通、时间按小汽车、没有最近设施分析等）见 docs/本地路径服务问题说明_20261028.md
providers = ["local", "online"]
# 内网 ArcGIS Server 10.8 NAServer 的 Route 图层（不要令牌）
local_url = "<内网 NAServer Route 图层地址，如 https://<主机>:6443/arcgis/rest/services/.../NAServer/Route>"
local_mode = "Heavy Vehicles"
# 服务器是自签证书：false = 只对 local_url 跳过证书校验
local_verify_ssl = false
# 本地服务的 Minutes 是小汽车口径；乘这个系数对齐在线卡车时间。Claude 自定（2026-10-28）：
# RD-A 两场 61 mm 雨 315 段派单，在线卡车 ÷ 本地 中位 1.67（P10 1.48、P90 1.87），out/routes/svc_compare/。1 = 不校正
local_time_factor = 1.67

[agents]
# 多智能体（swbrain/agents/）：主智能体把问题分派给调度研判 / 一二维计算 / 报告交付 / 数据质检。false = 退回单个排水智能体
enabled = true
# 主智能体用大模型分派（delegate 工具）、三个专业智能体用大模型规划（工具只有自己名下的动作）；用 [agent] 的模型与密钥，没密钥或出错退回规则。false = 全部规则
llm = true
# 端点 / 模型 / 密钥变量可以单独给多智能体指定（缺省沿用 [agent]）。DeepSeek 的 Anthropic 兼容端点：
# api_key_env = "DEEPSEEK_API_KEY"
# base_url = "https://api.deepseek.com/anthropic"
# model = "deepseek-flash"
# 主智能体分派一次的 token 上限（思考型模型先想再调工具，太小会在调 delegate 之前截断）
# router_max_tokens = 2000

[identity]
# 统一身份与租户（SDIP，可选）。缺省 shared_key = 照旧用 [serve].access_key / admin_key 两把共享口令，不需要 SDIP、不需要 PyJWT。
# 有 SDIP 平台、并拿到回执（docs/SDIP工单_排水智能体接入统一身份.md）后才改成 sdip：每人用平台账号登录，按职能 SWBRAIN.* 判权限，共享口令一律不认。
# sdip 模式还要：pip install "PyJWT[crypto]==2.10.1"；客户端密钥放环境变量（client_secret_env 指的那个），不写进本文件。
mode = "shared_key"
# ---- 以下只在 mode = "sdip" 时用 ----
# 签发源（Keycloak realm）。JWKS 与令牌地址按 Keycloak 约定从它推出，平台换地址只改这一处
# 服务和签发源在同一台机器时写本机回环地址（局域网地址会变，回环不会），并开 issuer_discovery
issuer = ""
# true = 启动时取发现文档：令牌的 iss、浏览器去登录 / 注销的地址都按签发源自己报的（Keycloak 按它的主机名签 iss，局域网地址一换就跟着变）；
# 验签遇到 iss 不符时再取一次，不用重启。false = iss 必须和上面的 issuer 一字不差
issuer_discovery = false
client_id = "swbrain"
# 用户令牌的 aud（平台给客户端配的受众映射器）
audience = "swbrain"
client_secret_env = "SWBRAIN_SDIP_CLIENT_SECRET"
# SDIP 门户服务（/api/portal/session）
portal_base = ""
# 租户号：服务端不给缺省值，必填
tenant_id = ""
# 本服务对外地址：拼登录回调 <public_base>/auth/callback，也是写请求的 Origin 校验值（要和浏览器地址栏一致）
public_base = "http://127.0.0.1:8766"
# 其他对外地址（局域网访问用，2026-10-02）：每个都要在平台登记 <地址>/auth/callback 与 <地址>/ 两条回跳。
# 有一个非本机地址，服务就听全部网卡，Harness Web UI 也会让这些主机访问。局域网走 http 时登录凭据明文过网。
# 写 "auto" = 本机当前的每个局域网 IPv4（端口同 public_base），换了地址不用改配置、不用重启；平台那边仍要登记新地址的回调。
extra_public_bases = []
# 允许推 /api/feed/* 的服务账号：Keycloak 用户名（swb-feed 用 swbrain 客户端的客户端凭据，用户名是 service-account-swbrain，回执第四节）
feed_clients = ["service-account-swbrain"]
