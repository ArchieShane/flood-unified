# 只计地面汇流路程不超过此值的格（米）：约 15 分钟以内能到进水口；平坦沙地上 D8 会把几公里外的地面都归到一个进水口
max_flow_len_m = 1000.0
# 地块内（建筑与院落）按阿布扎比惯例自排（渗井/自有系统），不计入公共雨水管网汇水；false 则全部地面都计入
