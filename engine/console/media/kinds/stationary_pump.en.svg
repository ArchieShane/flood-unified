<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-label="Temporary conveyance · surface pipeline + stationary pump" font-family="IBM Plex Sans, 'Noto Sans SC', sans-serif">
  <defs>
    <pattern id="soil" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#efe6d2"/><circle cx="3" cy="3" r="1" fill="#cdbb95"/><circle cx="8" cy="7" r="1" fill="#cdbb95"/></pattern>
    <pattern id="conc" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c9ced6"/><path d="M0 8L8 0" stroke="#aeb5bf" stroke-width="1"/></pattern>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="dm" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M0,4 L8,4 M4,0 L4,8" stroke="#334155" stroke-width="1.2"/></marker>
  </defs>
  <rect width="780" height="430" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">Temporary conveyance · surface pipeline + stationary pump</text>
  <text x="760" y="28" font-size="12" text-anchor="end" fill="#7c3aed" font-weight="600">Client level: L2 · IDD / Municipality</text>
  <rect x="0" y="250" width="780" height="150" fill="url(#soil)"/><rect x="0" y="244" width="780" height="6" fill="#475569"/>
  <path d="M40 244 Q140 290 240 244" fill="#60a5fa" opacity=".6" stroke="#1d4ed8"/>
  <text x="140" y="234" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">Flood low point</text>
  <rect x="160" y="250" width="36" height="70" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="160" y="280" width="36" height="40" fill="#93c5fd" opacity=".8"/>
  <text x="178" y="338" font-size="11" text-anchor="middle" fill="#334155">Temporary sump / manhole</text>
  <rect x="230" y="190" width="96" height="46" rx="6" fill="#0e7490"/><circle cx="248" cy="240" r="9" fill="#1f2937"/><circle cx="308" cy="240" r="9" fill="#1f2937"/>
  <path d="M190 290 V214 H230" stroke="#334155" stroke-width="6" fill="none"/>
  <text x="278" y="178" font-size="12" text-anchor="middle" fill="#0e7490" font-weight="600">Stationary pump (placed before the storm)</text>
  <text x="278" y="164" font-size="10.5" text-anchor="middle" fill="#155e75">float switch, diesel or electric</text>
  <path d="M326 220 H600 V190 H690" stroke="#64748b" stroke-width="9" fill="none"/><path d="M326 220 H598 V190 H690" stroke="#22d3ee" stroke-width="3" fill="none"/>
  <text x="460" y="210" font-size="11.5" text-anchor="middle" fill="#334155">Surface pipeline (along the verge, removed after)</text>
  <path d="M676 244 L700 314 H752 L776 244 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><path d="M688 278 L700 314 H752 L764 278 Z" fill="#93c5fd" opacity=".8"/>
  <path d="M690 190 V270" stroke="#64748b" stroke-width="9"/><path d="M690 190 V268" stroke="#22d3ee" stroke-width="3" marker-end="url(#ar)"/>
  <text x="730" y="150" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">Discharge point</text>
  <text x="760" y="330" font-size="10.5" text-anchor="end" fill="#334155">outfall / channel / downstream network with spare capacity</text>
  <text x="20" y="380" font-size="11" fill="#155e75">capacity = pump rate × units; pipe length sets the head</text>
  <text x="20" y="418" font-size="10.5" fill="#64748b">Pumps water away from the flood point to where it can go; adds no storage, it moves the water. Schematic, not a construction drawing.</text>
</svg>
