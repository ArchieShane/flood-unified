<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-label="Wet well / sump" font-family="IBM Plex Sans, 'Noto Sans SC', sans-serif">
  <defs>
    <pattern id="soil" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#efe6d2"/><circle cx="3" cy="3" r="1" fill="#cdbb95"/><circle cx="8" cy="7" r="1" fill="#cdbb95"/></pattern>
    <pattern id="conc" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c9ced6"/><path d="M0 8L8 0" stroke="#aeb5bf" stroke-width="1"/></pattern>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="dm" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M0,4 L8,4 M4,0 L4,8" stroke="#334155" stroke-width="1.2"/></marker>
  </defs>
  <rect width="780" height="430" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">Wet well / sump</text>
  <text x="760" y="28" font-size="12" text-anchor="end" fill="#7c3aed" font-weight="600">Client level: as its pump station (L1 existing / L2 new)</text>
  <rect x="0" y="90" width="780" height="310" fill="url(#soil)"/><rect x="0" y="84" width="780" height="6" fill="#475569"/>
  <rect x="300" y="90" width="180" height="290" fill="url(#conc)" stroke="#64748b" stroke-width="2"/><rect x="314" y="100" width="152" height="266" fill="#fff"/>
  <rect x="314" y="240" width="152" height="126" fill="#60a5fa" opacity=".55"/>
  <path d="M0 210 H314" stroke="#64748b" stroke-width="12"/><path d="M0 210 H312" stroke="#93c5fd" stroke-width="5" marker-end="url(#ar)"/><text x="20" y="198" font-size="11.5" fill="#334155">Inlet pipe</text>
  <path d="M300 240 H270" stroke="#16a34a" stroke-width="2"/><text x="266" y="244" font-size="11" text-anchor="end" fill="#15803d" font-weight="600">Pump-on level</text>
  <path d="M300 330 H270" stroke="#b91c1c" stroke-width="2"/><text x="266" y="334" font-size="11" text-anchor="end" fill="#b91c1c" font-weight="600">Pump-off level</text>
  <rect x="380" y="328" width="34" height="30" rx="6" fill="#0e7490"/><path d="M397 328 V130 H600 V84" stroke="#64748b" stroke-width="7" fill="none"/>
  <path d="M397 326 V130 H598 V90" stroke="#22d3ee" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="610" y="124" font-size="11.5" fill="#0e7490" font-weight="600">Rising main</text>
  <text x="490" y="290" font-size="11" fill="#1e3a8a">working volume: stops short-cycling and running dry</text>
  <text x="20" y="418" font-size="10.5" fill="#64748b">The sump a pump draws from; without it a pump on a plain manhole runs dry and goes unstable (as with 29.RB2's PO pumps). A constant-area storage node in SWMM. Schematic, not a construction drawing.</text>
</svg>
