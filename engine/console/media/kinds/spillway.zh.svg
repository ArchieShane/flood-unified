<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-label="溢流堰" font-family="IBM Plex Sans, 'Noto Sans SC', sans-serif">
  <defs>
    <pattern id="soil" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#efe6d2"/><circle cx="3" cy="3" r="1" fill="#cdbb95"/><circle cx="8" cy="7" r="1" fill="#cdbb95"/></pattern>
    <pattern id="conc" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c9ced6"/><path d="M0 8L8 0" stroke="#aeb5bf" stroke-width="1"/></pattern>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="dm" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M0,4 L8,4 M4,0 L4,8" stroke="#334155" stroke-width="1.2"/></marker>
  </defs>
  <rect width="780" height="430" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">溢流堰</text>
  <text x="760" y="28" font-size="12" text-anchor="end" fill="#7c3aed" font-weight="600">客户分级：L2 · CAPEX（图 A）/ IDD（图 B）</text>
  <rect x="0" y="330" width="780" height="70" fill="url(#soil)"/>
  <path d="M40 120 V330 H360 V170 H400 V330 H760" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="43" y="150" width="315" height="180" fill="#60a5fa" opacity=".55"/><path d="M43 150 H358" stroke="#1d4ed8" stroke-dasharray="6 4"/>
  <rect x="360" y="170" width="40" height="160" fill="url(#conc)" stroke="#64748b"/>
  <path d="M358 152 Q400 150 420 200 T470 310" stroke="#1d4ed8" stroke-width="10" fill="none" opacity=".5"/><path d="M430 250 L480 300" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="200" y="270" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="600">塘 / 明渠 / 箱涵</text>
  <text x="380" y="164" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="600">堰顶</text>
  <text x="470" y="170" font-size="11" fill="#1e3a8a">超过堰顶的水溢出</text><text x="600" y="318" font-size="11.5" text-anchor="middle" fill="#334155">指定的溢流通道</text>
  <text x="20" y="418" font-size="10.5" fill="#64748b">水位到堰顶就溢出，把超量的水安全地放到指定去处，保护构筑物和下游。SWMM 里是 WEIR。示意，不是施工图。</text>
</svg>
